plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.beezhub'
version = '1.0.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

// Spring Boot 3.5.7 manages Testcontainers at 1.21.3, which cannot talk to Docker Engine 29
// (now on ubuntu-latest and Docker Desktop): every container test fails with "Could not find a
// valid Docker environment". 1.21.4 adds support. Drop this line once the Boot BOM ships >= 1.21.4.
ext['testcontainers.version'] = '1.21.4'

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.security:spring-security-crypto'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect:3.4.0'
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
	implementation 'org.mapstruct:mapstruct:1.6.3'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	// Amazon S3 on PROD, and an S3-compatible container locally and on NONPROD
	// (GH-331). The URLConnection client instead of the SDK's default Apache and Netty clients: the
	// only caller is synchronous and low-volume, and it adds no further dependencies.
	implementation platform('software.amazon.awssdk:bom:2.56.0')
	implementation('software.amazon.awssdk:s3') {
		exclude group: 'software.amazon.awssdk', module: 'apache-client'
		exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
	}
	implementation 'software.amazon.awssdk:url-connection-client'
	implementation('org.ff4j:ff4j-spring-boot-starter:1.9') {
		exclude group: 'org.springdoc'
		// FF4j's own REST API (/api/ff4j/**) would let any authenticated user flip flags.
		// Feature flags are managed through FeatureController (/api/admin/features) instead.
		exclude group: 'org.ff4j', module: 'ff4j-spring-boot-web-api'
	}
	implementation 'org.ff4j:ff4j-store-springjdbc:1.9'
	implementation 'com.google.code.gson:gson:2.10.1'
	implementation 'me.paulschwarz:spring-dotenv:4.0.0'
	implementation 'net.logstash.logback:logstash-logback-encoder:7.4'
	implementation 'io.micrometer:micrometer-registry-prometheus'
}

test {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat = "full"
	}

}

jacoco {
	toolVersion = "0.8.12"
	reportsDirectory = layout.buildDirectory.dir("jacocoHtml")
}

def jacocoExcludes = [
	// Generated / boilerplate — not meaningful to unit-test
	'**/model/dto/**',
	'**/model/entity/**',
	'**/model/enums/**',
	'**/mapper/**',
	// Spring Boot entry-point
	'**/*Application*',
]

jacocoTestReport {
	reports {
		csv.required = true
		xml.required = true
		html.required = true
	}
	dependsOn test
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: jacocoExcludes)
		}))
	}
}

jacocoTestCoverageVerification {
	dependsOn jacocoTestReport
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: jacocoExcludes)
		}))
	}
	violationRules {
		// Global 70% line coverage across the whole project
		rule {
			element = 'BUNDLE'
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.70
			}
		}

		// Specific rule for AllocationScoringService (90%)
		rule {
			element = 'CLASS'
			includes = ['com.beezhub.student_accommodation.service.AllocationScoringService']
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.90
			}
		}

		// Direct service classes — minimum 70%
		// Sub-packages (allocation, notification, document, tenant, application) are excluded
		// because they are covered by integration tests, not unit tests.
		rule {
			element = 'CLASS'
			includes = ['com.beezhub.student_accommodation.service.**']
			excludes = [
				'com.beezhub.student_accommodation.service.AllocationScoringService',
				'com.beezhub.student_accommodation.service.allocation.*',
				'com.beezhub.student_accommodation.service.notification.*',
				'com.beezhub.student_accommodation.service.document.*',
				'com.beezhub.student_accommodation.service.tenant.*',
				'com.beezhub.student_accommodation.service.application.*',
			]
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.70
			}
		}
	}
}

check.dependsOn jacocoTestCoverageVerification
