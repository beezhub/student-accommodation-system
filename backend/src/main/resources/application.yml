spring:
  application:
    name: student-accommodation
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/studentaccommodationlocaldb}
    # No defaults: a missing credential must fail startup rather than silently using a dev account.
    username: ${USER_DB}
    password: ${PASSWORD_DB}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: student-accommodation-pool
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:25}
      minimum-idle: ${HIKARI_MIN_IDLE:10}
      idle-timeout: 300000         # 5 min — recycle idle connections before Postgres drops them
      connection-timeout: 30000
      max-lifetime: 600000          # 10 min — safely below typical Postgres tcp_keepalive timeout
      keepalive-time: 120000        # 2 min — periodic ping to prevent Postgres from closing idle connections
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          auto: validate
  flyway:
    baseline-on-migrate: true
    baseline-version: ${FLYWAY_BASELINE_VERSION:2026.02.19.2100}
    enabled: true
    password: ${PASSWORD_DB}
    user: ${USER_DB}
    url: ${DB_URL:jdbc:postgresql://localhost:5432/studentaccommodationlocaldb}
    locations: classpath:db/migration
    out-of-order: false
    validate-on-migrate: true
    placeholders:
      # true keeps the seeded demo administrator usable; anything else disables it (see
      # V2026_09_05_1000__disable_seeded_admin.sql). Never set this in NONPROD or PROD.
      demoSeed: ${DEMO_SEED:false}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Empty locally; set wherever Redis requires auth.
      password: ${REDIS_PASSWORD:}
      timeout: 60000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:noreply@studentaccommodation.local}
    password: ${MAIL_PASSWORD:test}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}
          # Without these a hung SMTP host blocks a notificationExecutor thread forever, and with
          # 20 threads the whole notification pipeline stops (GH-132). JavaMail defaults to
          # waiting indefinitely.
          connectiontimeout: ${MAIL_CONNECT_TIMEOUT_MS:5000}
          timeout: ${MAIL_READ_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:5000}
    default-encoding: UTF-8
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:20MB}
      file-size-threshold: 2MB
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true
jwt:
  secret: ${JWT_SECRET}
  expiration-time-ms: ${JWT_EXPIRATION:36000000}
  admin-expiration-time-ms: ${JWT_ADMIN_EXPIRATION:14400000}
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET:student-accommodation-bucket}
  connect-timeout-s: ${MINIO_CONNECT_TIMEOUT_S:30}
  read-timeout-s: ${MINIO_READ_TIMEOUT_S:30}
  write-timeout-s: ${MINIO_WRITE_TIMEOUT_S:30}
app:
  base-url: ${APP_BASE_URL}
  support-email: ${APP_SUPPORT_EMAIL:accommodation@university.edu}
  university-name: ${APP_UNIVERSITY_NAME:University}
  contact-phone: ${APP_CONTACT_PHONE:+27 (0) 11 000 0000}
  notification:
    retry-delay-minutes: ${NOTIFICATION_RETRY_DELAY_MINUTES:5}
    retry-check-interval-ms: ${NOTIFICATION_RETRY_CHECK_INTERVAL_MS:300000}
  allocation:
    offer-expiry-days: ${OFFER_EXPIRY_DAYS:7}
    check-in-expiry-days: ${CHECK_IN_EXPIRY_DAYS:7}
    expiry-check-interval-ms: ${EXPIRY_CHECK_INTERVAL_MS:3600000}
    # Batch allocation properties
    batch-enabled: ${BATCH_ENABLED:true}
    batch-interval-ms: ${BATCH_INTERVAL_MS:21600000}  # 6 hours
    batch-size: ${BATCH_SIZE:50}
    batch-on-expiry: ${BATCH_ON_EXPIRY:true}
  # No app.features block: the auto-allocation flag lives in ff4j_features and is toggled through
  # /api/admin/features. A property that overwrote it on every boot silently reverted admin
  # changes at the next restart (GH-142).
  security:
    # Browser origins allowed to call the API. No default: an unset value must fail startup rather
    # than silently falling back to localhost, which would block the real front end (GH-135).
    allowed-origins: ${ALLOWED_ORIGINS}
    # Object-storage origin the browser loads presigned document and image URLs from; used in the CSP.
    storage-public-origin: ${STORAGE_PUBLIC_ORIGIN:http://localhost:9000}
    # Addresses of reverse proxies whose X-Forwarded-For may be trusted. Leave empty when the app is
    # reached directly. Unset behind a proxy, every client shares the proxy's address and therefore
    # one rate-limit bucket, which throttles the whole deployment.
    trusted-proxies: ${APP_SECURITY_TRUSTED_PROXIES:}
    rate-limit:
      requests-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:30}
  admin-bootstrap:
    # Creates or resets the first PLATFORM_ADMIN at startup; leave blank once the admin has signed in.
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  storage:
    cleanup:
      cron: ${STORAGE_CLEANUP_CRON:0 0 3 * * *}
      # Objects written more recently than this are never treated as orphans; the DB row commits after the object write
      grace-period-minutes: ${STORAGE_CLEANUP_GRACE_MINUTES:60}
async:
  core-pool-size: ${ASYNC_CORE_POOL_SIZE:10}
  max-pool-size: ${ASYNC_MAX_POOL_SIZE:20}
  queue-capacity: ${ASYNC_QUEUE_CAPACITY:500}

server:
  # In-flight requests finish instead of being cut off mid-transaction on SIGTERM.
  shutdown: graceful

spring.lifecycle.timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Never leak component detail to an unauthenticated caller of /actuator/health.
      show-details: never
      # Boot only turns these on when it detects Kubernetes or Cloud Foundry, so without this
      # the aggregate /actuator/health is the only surface, and it runs every contributor:
      # SMTP opens a socket, MinIO checks the bucket, Redis pings, and Boot adds a full mail
      # connection test. Any one of them DOWN made the whole probe 503 and the container
      # unhealthy, so an SMTP outage restarted a perfectly healthy application (GH-147).
      probes:
        enabled: true
      group:
        # Liveness answers one question: is this JVM broken beyond recovery. Nothing external
        # belongs here, because a restart cannot fix someone else's outage.
        liveness:
          include: livenessState
        # Readiness adds the database, the one dependency the application cannot serve without.
        #
        # Redis is deliberately excluded: token blacklist checks fail open and the rate-limit
        # filter swallows Redis errors, so an outage keeps traffic flowing with revocation and
        # auth rate limiting disabled. That is an availability-over-security choice, taken
        # knowingly. SMTP and MinIO are excluded because neither blocks serving a request.
        readiness:
          include: readinessState,db
  metrics:
    scrape:
      # HTTP basic credentials Prometheus uses for /actuator/prometheus. With the password empty the
      # endpoint stays PLATFORM_ADMIN-only; setting it registers a scrape-only account that can read
      # nothing else. Never expose the actuator port publicly.
      username: ${PROMETHEUS_SCRAPE_USER:prometheus}
      password: ${PROMETHEUS_SCRAPE_PASSWORD:}
