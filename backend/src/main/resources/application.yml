spring:
  application:
    name: student-accommodation
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/studentaccommodationlocaldb}
    username: ${USER_DB:localadmin}
    password: ${PASSWORD_DB:admin}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: student-accommodation-pool
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      connection-timeout: 30000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  jpa:
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        hbm2ddl:
          auto: update
  flyway:
    baseline-on-migrate: true
    enabled: true
    password: ${PASSWORD_DB:admin}
    user: ${USER_DB:localadmin}
    url: ${DB_URL:jdbc:postgresql://localhost:5432/studentaccommodationlocaldb}
    locations: classpath:db/migration
    out-of-order: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:noreply@studentaccommodation.local}
    password: ${MAIL_PASSWORD:test}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
    default-encoding: UTF-8
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:20MB}
      file-size-threshold: 2MB
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true
jwt:
  secret: ${JWT_SECRET:jCiWx+J9UALsCG/0E4elPktfQpDd7EpipyN1AGrCE2HNAjf826VSFMklA76gqBf23ZP8P1kq9DmC95dSolXknQ==}
  expiration-time-ms: ${JWT_EXPIRATION:36000000}
  admin-expiration-time-ms: ${JWT_ADMIN_EXPIRATION:14400000}
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET:student-accommodation-bucket}
app:
  base-url: ${APP_BASE_URL:http://localhost:4200}
  support-email: ${APP_SUPPORT_EMAIL:accommodation@university.edu}
  university-name: ${APP_UNIVERSITY_NAME:University}
  notification:
    retry-delay-minutes: ${NOTIFICATION_RETRY_DELAY_MINUTES:5}
    retry-check-interval-ms: ${NOTIFICATION_RETRY_CHECK_INTERVAL_MS:300000}
