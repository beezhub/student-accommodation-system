<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - Student Accommodation">Student Accommodation</title>
    <style>
        /*
         * Colours are the app's tokens (frontend/src/styles/_variables.scss): primary #7c3aed,
         * success #059669, warning #d97706, error #dc2626, info #0284c7, slate greys. Box
         * backgrounds and headings are the light and dark shades of the same families.
         * Keep every colour in this file, as flat background-color values: Outlook drops
         * blended backgrounds and shows none at all.
         */

        /* ===== RESET & BASE ===== */
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #334155;
            margin: 0;
            padding: 0;
            background-color: #f1f5f9;
        }

        /* ===== LAYOUT ===== */
        .email-wrapper {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        /* ===== HEADER ===== */
        .email-header {
            background-color: #7c3aed;
            color: #ffffff;
            padding: 32px 30px;
            text-align: center;
        }
        .email-header h1 {
            margin: 0 0 8px 0;
            font-size: 26px;
            font-weight: bold;
        }
        .email-header p {
            margin: 0;
            font-size: 14px;
            opacity: 0.9;
        }

        /* ===== CONTENT ===== */
        .email-content {
            padding: 30px;
        }
        .email-content p {
            margin: 0 0 16px 0;
        }

        /* ===== COMMON BOXES ===== */
        .info-box {
            background-color: #f0f9ff;
            border-left: 4px solid #0284c7;
            padding: 16px 20px;
            margin: 20px 0;
            border-radius: 4px;
        }
        .info-box h3 {
            margin: 0 0 8px 0;
            color: #075985;
        }
        .success-box {
            background-color: #ecfdf5;
            border-left: 4px solid #059669;
            padding: 16px 20px;
            margin: 20px 0;
            border-radius: 4px;
        }
        .success-box h3 {
            margin: 0 0 8px 0;
            color: #065f46;
        }
        .warning-box {
            background-color: #fffbeb;
            border-left: 4px solid #d97706;
            padding: 16px 20px;
            margin: 20px 0;
            border-radius: 4px;
        }
        .warning-box h3 {
            margin: 0 0 8px 0;
            color: #92400e;
        }
        .danger-box {
            background-color: #fef2f2;
            border-left: 4px solid #dc2626;
            padding: 16px 20px;
            margin: 20px 0;
            border-radius: 4px;
        }
        .danger-box h3 {
            margin: 0 0 8px 0;
            color: #991b1b;
        }
        .neutral-box {
            background-color: #f8fafc;
            border-left: 4px solid #64748b;
            padding: 16px 20px;
            margin: 20px 0;
            border-radius: 4px;
        }

        /* ===== ROOM SUMMARY ===== */
        .room-highlight {
            background-color: #f5f3ff;
            border: 1px solid #7c3aed;
            color: #1e293b;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            text-align: center;
        }
        .room-highlight h2 { margin: 0 0 6px 0; font-size: 28px; color: #6d28d9; }
        .room-highlight p { margin: 4px 0; font-size: 16px; }
        .text-success { color: #059669; font-weight: bold; }
        .text-muted { color: #64748b; font-size: 14px; }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }
        .info-item {
            background-color: #f8fafc;
            padding: 15px;
            border-radius: 5px;
            border-left: 3px solid #7c3aed;
        }
        .info-item strong { display: block; color: #6d28d9; margin-bottom: 5px; }

        /* ===== CTA BUTTON ===== */
        /* The colour is repeated inline on each button: Gmail paints links its own blue otherwise. */
        .cta-section {
            text-align: center;
            margin: 24px 0;
        }
        .cta-button {
            display: inline-block;
            background-color: #7c3aed;
            color: #ffffff !important;
            padding: 13px 32px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 15px;
        }

        /* ===== DATA TABLE ===== */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
        }
        .data-table td {
            padding: 8px 12px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }
        .data-table td:first-child {
            font-weight: bold;
            color: #475569;
            width: 40%;
        }

        /* ===== FOOTER ===== */
        .email-footer {
            background-color: #f8fafc;
            padding: 20px 30px;
            text-align: center;
            font-size: 13px;
            color: #64748b;
            border-top: 1px solid #e2e8f0;
        }
        .email-footer a {
            color: #7c3aed;
            text-decoration: none;
        }
        .email-footer .contact-info {
            margin: 8px 0;
        }

        /* ===== RESPONSIVE ===== */
        @media screen and (max-width: 600px) {
            .email-wrapper { margin: 0; border-radius: 0; }
            .email-content { padding: 20px; }
            .email-header { padding: 24px 20px; }
            .info-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="email-wrapper">

    <!-- HEADER -->
    <div class="email-header">
        <h1 layout:fragment="email-title">Student Accommodation System</h1>
        <p layout:fragment="email-subtitle">Notification</p>
    </div>

    <!-- CONTENT -->
    <div class="email-content" layout:fragment="email-content">
        <!-- Template content goes here -->
    </div>

    <!-- FOOTER -->
    <div class="email-footer">
        <p>This is an automated message from the Student Accommodation System.</p>
        <p class="contact-info">
            For assistance: <a th:href="'mailto:' + ${supportEmail}" th:text="${supportEmail}">support@university.edu</a>
            <th:block th:if="${contactPhone != null and !#strings.isEmpty(contactPhone)}">
                &nbsp;|&nbsp; <span th:text="${contactPhone}">+27 (0) 11 000 0000</span>
            </th:block>
        </p>
        <p>&copy; <span th:text="${currentYear}">2025</span> <span th:text="${universityName}">Student Accommodation System</span>. All rights reserved.</p>
    </div>

</div>
</body>
</html>
