spring:
  # H2 datasource — overridden at runtime by AbstractIntegrationTest / AbstractJpaTest
  # via @DynamicPropertySource to use a Testcontainers PostgreSQL container.
  # These H2 defaults only apply to test classes that do NOT extend either abstract base.
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=YEAR
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  mail:
    password: test-mail-password

# Test-only security values — not used in production
jwt:
  secret: test-secret-for-unit-tests-only-must-be-at-least-64-chars-long-padding
  expiration-time-ms: 36000000
  admin-expiration-time-ms: 14400000

# Values the main application.yml no longer defaults, so tests that load a context still start.
# Production deliberately fails fast when these are unset (GH-135).
app:
  base-url: http://localhost:4200
  security:
    allowed-origins: http://localhost:4200
    storage-public-origin: http://localhost:9000
s3:
  access-key: test-access-key
  secret-key: test-secret-key
