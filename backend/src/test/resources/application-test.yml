spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=YEAR
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=YEAR
    user: sa
    password:
  h2:
    console:
      enabled: false
  logging:
    level:
      org.hibernate.SQL: WARN
      org.hibernate.type.descriptor.sql.BasicBinder: WARN
      org.flywaydb: DEBUG
  mail:
    password: test-mail-password

# Test-only security values — not used in production
jwt:
  secret: test-secret-for-unit-tests-only-minimum-32-chars
  expiration-time-ms: 36000000
  admin-expiration-time-ms: 14400000
