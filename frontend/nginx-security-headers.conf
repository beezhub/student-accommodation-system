# Security headers for every response nginx serves. Included by nginx.conf in the server block and
# again in each location that declares its own add_header: nginx drops every inherited add_header
# from a block that has one, so location / served every route except the root without any of these.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# frame-src and object-src allow blob: for the document previews, which fetch the file through the
# API and show PDFs in an iframe from a blob: URL. A blob: document inherits this policy, and Chrome
# renders the PDF with a plugin element, hence object-src too. Other origins stay refused (GH-362).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self' https://nominatim.openstreetmap.org; frame-src 'self' blob:; object-src 'self' blob:" always;
