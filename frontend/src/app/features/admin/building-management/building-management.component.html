<div class="building-management-container">
  <div class="page-header">
    <h1>
      <mat-icon>apartment</mat-icon>
      Building Management
    </h1>
    <button mat-raised-button color="primary" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon>
      Add Building
    </button>
  </div>

  <!-- Filters -->
  <mat-card class="filter-card">
    <mat-card-content>
      <form [formGroup]="filterForm" class="filter-form">
        <mat-form-field appearance="outline">
          <mat-label>Building Name</mat-label>
          <input matInput formControlName="name" placeholder="Search by name">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Address</mat-label>
          <input matInput formControlName="address" placeholder="Search by address">
        </mat-form-field>

        <div class="filter-actions">
          <button mat-raised-button color="primary" (click)="onFilter()">
            <mat-icon>search</mat-icon>
            Search
          </button>
          <button mat-button (click)="onClearFilters()">
            <mat-icon>clear</mat-icon>
            Clear
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>

  <!-- Data Table -->
  <mat-card>
    <mat-card-content>
      <div *ngIf="isLoading" class="loading-container">
        <mat-spinner></mat-spinner>
      </div>

      <div *ngIf="!isLoading">
        <table mat-table [dataSource]="buildings" class="buildings-table">
          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Building Name</th>
            <td mat-cell *matCellDef="let building">
              <strong>{{ building.name }}</strong>
            </td>
          </ng-container>

          <!-- Address Column -->
          <ng-container matColumnDef="address">
            <th mat-header-cell *matHeaderCellDef>Address</th>
            <td mat-cell *matCellDef="let building">
              {{ building.address || 'N/A' }}
            </td>
          </ng-container>

          <!-- Total Floors Column -->
          <ng-container matColumnDef="totalFloors">
            <th mat-header-cell *matHeaderCellDef>Floors</th>
            <td mat-cell *matCellDef="let building">
              {{ building.totalFloors || 'N/A' }}
            </td>
          </ng-container>

          <!-- Created At Column -->
          <ng-container matColumnDef="createdAt">
            <th mat-header-cell *matHeaderCellDef>Created</th>
            <td mat-cell *matCellDef="let building">
              {{ building.createdAt | date: 'MMM d, y' }}
            </td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let building">
              <button mat-icon-button [matMenuTriggerFor]="menu" matTooltip="Actions">
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #menu="matMenu">
                <button mat-menu-item (click)="openEditDialog(building)">
                  <mat-icon>edit</mat-icon>
                  <span>Edit</span>
                </button>
                <button mat-menu-item (click)="deleteBuilding(building)">
                  <mat-icon>delete</mat-icon>
                  <span>Delete</span>
                </button>
              </mat-menu>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <div *ngIf="buildings.length === 0" class="no-data">
          <mat-icon>apartment</mat-icon>
          <p>No buildings found</p>
          <button mat-raised-button color="primary" (click)="openCreateDialog()">
            <mat-icon>add</mat-icon>
            Add First Building
          </button>
        </div>

        <mat-paginator
          *ngIf="buildings.length > 0"
          [length]="totalElements"
          [pageSize]="pageSize"
          [pageSizeOptions]="[10, 20, 50]"
          (page)="onPageChange($event)"
          showFirstLastButtons>
        </mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
