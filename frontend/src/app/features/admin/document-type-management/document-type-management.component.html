<div class="document-type-management-container">
  <div class="page-header">
    <h1>
      <mat-icon>description</mat-icon>
      Document Type Management
    </h1>
    <button mat-raised-button color="primary" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon>
      Add Document Type
    </button>
  </div>

  <!-- Filters -->
  <mat-card class="filter-card">
    <mat-card-content>
      <form [formGroup]="filterForm" class="filter-form">
        <mat-form-field appearance="outline">
          <mat-label>Document Type Name</mat-label>
          <input matInput formControlName="name" placeholder="Search by name">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Required Status</mat-label>
          <mat-select formControlName="isRequired">
            <mat-option value="">All Types</mat-option>
            <mat-option [value]="true">Required Only</mat-option>
            <mat-option [value]="false">Optional Only</mat-option>
          </mat-select>
        </mat-form-field>

        <div class="filter-actions">
          <button mat-raised-button color="primary" (click)="onFilter()">
            <mat-icon>search</mat-icon>
            Search
          </button>
          <button mat-button (click)="onClearFilters()">
            <mat-icon>clear</mat-icon>
            Clear
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>

  <!-- Data Table -->
  <mat-card>
    <mat-card-content>
      <div *ngIf="isLoading" class="loading-container">
        <mat-spinner></mat-spinner>
      </div>

      <div *ngIf="!isLoading">
        <table mat-table [dataSource]="documentTypes" class="document-types-table">
          <!-- Type Name Column -->
          <ng-container matColumnDef="typeName">
            <th mat-header-cell *matHeaderCellDef>Document Type</th>
            <td mat-cell *matCellDef="let docType">
              <strong>{{ docType.typeName }}</strong>
            </td>
          </ng-container>

          <!-- Description Column -->
          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef>Description</th>
            <td mat-cell *matCellDef="let docType">
              {{ docType.description || '-' }}
            </td>
          </ng-container>

          <!-- Is Required Column -->
          <ng-container matColumnDef="isRequired">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let docType">
              <app-modern-status-badge
                [status]="getRequiredBadgeStatus(docType.isRequired)"
                size="sm">
              </app-modern-status-badge>
            </td>
          </ng-container>

          <!-- Created At Column -->
          <ng-container matColumnDef="createdAt">
            <th mat-header-cell *matHeaderCellDef>Created</th>
            <td mat-cell *matCellDef="let docType">
              {{ docType.createdAt | date: 'MMM d, y' }}
            </td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let docType">
              <button mat-icon-button [matMenuTriggerFor]="menu" matTooltip="Actions">
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #menu="matMenu">
                <button mat-menu-item (click)="openEditDialog(docType)">
                  <mat-icon>edit</mat-icon>
                  <span>Edit</span>
                </button>
                <button mat-menu-item (click)="toggleRequiredFlag(docType)">
                  <mat-icon>{{ docType.isRequired ? 'toggle_off' : 'toggle_on' }}</mat-icon>
                  <span>Mark as {{ docType.isRequired ? 'Optional' : 'Required' }}</span>
                </button>
                <button mat-menu-item (click)="deleteDocumentType(docType)">
                  <mat-icon>delete</mat-icon>
                  <span>Delete</span>
                </button>
              </mat-menu>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <div *ngIf="documentTypes.length === 0" class="no-data">
          <mat-icon>description</mat-icon>
          <p>No document types found</p>
          <button mat-raised-button color="primary" (click)="openCreateDialog()">
            <mat-icon>add</mat-icon>
            Add First Document Type
          </button>
        </div>

        <mat-paginator
          *ngIf="documentTypes.length > 0"
          [length]="totalElements"
          [pageSize]="pageSize"
          [pageSizeOptions]="[10, 20, 50, 100]"
          (page)="onPageChange($event)"
          showFirstLastButtons>
        </mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
