<div class="info-page">
  <div class="info-card">

    <div class="icon-ring">
      <mat-icon class="big-icon">hourglass_top</mat-icon>
    </div>

    <h1 class="info-title">You're all set!</h1>
    <p class="info-body">
      Your email has been verified. Your registration is now under review by our team.
    </p>

    <div class="timeline">
      <div class="timeline-item done">
        <div class="tl-dot"><mat-icon class="tl-icon">check</mat-icon></div>
        <div class="tl-text">
          <span class="tl-label">Registration submitted</span>
        </div>
      </div>
      <div class="timeline-item done">
        <div class="tl-dot"><mat-icon class="tl-icon">check</mat-icon></div>
        <div class="tl-text">
          <span class="tl-label">Email verified</span>
        </div>
      </div>
      <div class="timeline-item active">
        <div class="tl-dot pending"><mat-icon class="tl-icon">schedule</mat-icon></div>
        <div class="tl-text">
          <span class="tl-label">Under review</span>
          <span class="tl-sub">Typically 1–2 business days</span>
        </div>
      </div>
      <div class="timeline-item">
        <div class="tl-dot future"></div>
        <div class="tl-text">
          <span class="tl-label">Account activated</span>
          <span class="tl-sub">You'll receive an email with setup instructions</span>
        </div>
      </div>
    </div>

    <a routerLink="/login" class="back-link">Back to sign in</a>

  </div>
</div>
