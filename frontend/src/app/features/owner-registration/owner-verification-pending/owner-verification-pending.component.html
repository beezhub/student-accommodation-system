<div class="info-page">
  <div class="info-card">

    <div class="icon-ring">
      <mat-icon class="big-icon">mark_email_unread</mat-icon>
    </div>

    <h1 class="info-title">Check your email</h1>
    <p class="info-body">
      We've sent a verification link to
      @if (email) {
        <strong>{{ email }}</strong>
      } @else {
        your email address
      }.
      Click the link to verify your address and proceed with your registration.
    </p>

    <p class="info-hint">
      Didn't receive it? Check your spam folder, or resend below.
    </p>

    <button
      mat-flat-button
      class="resend-btn"
      (click)="resendVerification()"
      [disabled]="isResending || resendCooldown > 0"
    >
      @if (isResending) {
        Sending...
      } @else if (resendCooldown > 0) {
        Resend in {{ resendCooldown }}s
      } @else {
        Resend verification email
      }
    </button>

    <a routerLink="/login" class="back-link">Back to sign in</a>

  </div>
</div>
