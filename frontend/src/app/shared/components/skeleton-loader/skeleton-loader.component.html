<div class="skeleton-container" [attr.aria-hidden]="true">
  <ng-container *ngFor="let i of iterableCount">
    <div [class]="'skeleton-item skeleton-' + type">
      <ng-container [ngSwitch]="type">
        <!-- Card Skeleton -->
        <ng-container *ngSwitchCase="'card'">
          <div class="skeleton-card">
            <div class="skeleton-header">
              <div class="skeleton-avatar"></div>
              <div class="skeleton-title-lines">
                <div class="skeleton-line title"></div>
                <div class="skeleton-line subtitle"></div>
              </div>
            </div>
            <div class="skeleton-body">
              <div class="skeleton-line"></div>
              <div class="skeleton-line short"></div>
            </div>
          </div>
        </ng-container>

        <!-- Table Row Skeleton -->
        <ng-container *ngSwitchCase="'table-row'">
          <div class="skeleton-table-row">
            <div class="skeleton-cell avatar-cell"><div class="skeleton-avatar small"></div></div>
            <div class="skeleton-cell"><div class="skeleton-line"></div></div>
            <div class="skeleton-cell"><div class="skeleton-line"></div></div>
            <div class="skeleton-cell"><div class="skeleton-line short"></div></div>
            <div class="skeleton-cell action-cell"><div class="skeleton-btn"></div></div>
          </div>
        </ng-container>

        <!-- Text Block Skeleton -->
        <ng-container *ngSwitchCase="'text-block'">
          <div class="skeleton-line"></div>
          <div class="skeleton-line"></div>
          <div class="skeleton-line short"></div>
        </ng-container>

        <!-- Avatar Skeleton -->
        <ng-container *ngSwitchCase="'avatar'">
          <div class="skeleton-avatar"></div>
        </ng-container>
      </ng-container>
    </div>
  </ng-container>
</div>
