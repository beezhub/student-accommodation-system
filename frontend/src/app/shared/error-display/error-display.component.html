<div class="error-container">
  <mat-card class="error-card">
    <mat-card-content>
      <div class="error-content">
        <div class="error-icon" [ngClass]="'icon-' + errorConfig.color">
          <mat-icon>{{ errorConfig.icon }}</mat-icon>
        </div>

        <h2 class="error-title">{{ displayTitle }}</h2>
        <p class="error-message">{{ displayMessage }}</p>

        <div class="error-actions">
          <button
            *ngIf="showRetry"
            mat-raised-button
            color="primary"
            (click)="onRetry()">
            <mat-icon>refresh</mat-icon>
            Try Again
          </button>

          <button
            *ngIf="showGoBack"
            mat-stroked-button
            (click)="onGoBack()">
            <mat-icon>arrow_back</mat-icon>
            Go Back
          </button>

          <button
            *ngIf="customAction"
            mat-raised-button
            color="accent"
            (click)="onCustomAction()">
            {{ customAction }}
          </button>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
