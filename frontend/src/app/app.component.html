<div class="app-container">
  <!-- Toolbar: hidden on admin routes and unauthenticated auth pages -->
  @if (!isAdminRoute && !isHomePage) {
    <mat-toolbar class="app-toolbar" color="primary">
      <div class="toolbar-content">
        <a class="brand-link" routerLink="/home" mat-button>
          <mat-icon>home</mat-icon>
          <span class="brand-text">Student Housing</span>
        </a>

        <div class="nav-spacer"></div>

        <app-nav-menu (logout)="logout()"></app-nav-menu>
      </div>
    </mat-toolbar>
  }
  <!-- Main Content Area -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
