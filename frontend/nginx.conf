events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # index.html must be revalidated on every load. It is the only HTML the bundle serves, and it is
    # also the try_files fallback for every unknown path, sent with Last-Modified and no
    # Cache-Control, so browsers kept it for days by heuristic. A browser that once got it for
    # /grafana/ kept showing the Angular app there after Caddy started routing that path to Grafana,
    # and every deploy left users on the previous bundle. The hashed JS and CSS stay cacheable. An
    # empty value sends no header.
    map $sent_http_content_type $html_cache_control {
        ~^text/html "no-cache";
        default     "";
    }

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # ── Security headers ────────────────────────────────────────────────────
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control $html_cache_control always;

        # Explicitly serve index.html for root path
        location = / {
            try_files /index.html =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
            # Repeated because any add_header here stops this block inheriting the server's.
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control $html_cache_control always;
            add_header Access-Control-Allow-Origin "http://localhost:4200" always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header Access-Control-Expose-Headers 'Content-Length,Content-Range' always;
        }

        # Server-sent events. The stream stays open and the backend writes only when there is a
        # notification, so a quiet stream looks idle to the proxy. With the /api/ read timeout
        # below, nginx cut every quiet stream, logged "upstream timed out" and the browser
        # reconnected in a loop (GH-368). The timeout here is longer than the emitter's own 30
        # minutes in SseService, so the backend ends the stream first and nginx never does.
        # Buffering must be off or nginx holds events back until a buffer fills. An empty
        # Connection header keeps the upstream leg HTTP/1.1 keep-alive; the /api/ block sends
        # 'upgrade', which is wrong for a plain stream.
        location = /api/notifications/stream {
            proxy_pass http://student-accommodation-back-end:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 60s;
            proxy_read_timeout 35m;
            proxy_send_timeout 60s;
        }

        location /api/ {
            # Without this nginx refuses any body over its 1 MB default, on deployed servers only:
            # locally the frontend calls the backend directly. The largest legitimate request is a
            # building image batch: 10 images at 5 MB in one request, plus multipart framing.
            # Keep it equal to spring.servlet.multipart.max-request-size in application.yml, so a
            # request that is too big gets this 413 instead of being copied to the backend first
            # (GH-450). The per-file rules live in the backend and the UI, not here.
            client_max_body_size 51m;
            proxy_pass http://student-accommodation-back-end:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
            proxy_send_timeout 60s;
        }

        # Web tier only. This answers from nginx itself, so it stays 200 with the backend and the
        # database both dead. Exact match, or the prefix would also swallow /health/readiness.
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'healthy\n';
        }

        # What the external uptime monitor probes (GH-249). Self-hosted monitoring cannot report
        # that its own host is down, so the only check worth having comes from outside, and it has
        # to traverse the path a real request takes: Caddy, nginx, the backend, the database. The
        # static /health above proves none of that, and a monitor pointed at it, or at /, would
        # stay green through a total outage of everything students actually use.
        #
        # Readiness rather than the aggregate /actuator/health, for the same reason deploy.yml
        # smoke-checks readiness: the aggregate runs the SMTP, MinIO and Redis contributors, and
        # any one of them DOWN turns the whole probe 503 (GH-147). An SMTP outage must not page
        # someone about a site that is serving perfectly well. The readiness group is
        # readinessState plus the database, the one dependency the application cannot serve
        # without.
        #
        # Unauthenticated by design: SecurityConfig permits exactly this path, and
        # management.endpoint.health.show-details is never, so the body is a bare status that
        # names no component.
        location = /health/readiness {
            access_log off;
            proxy_pass http://student-accommodation-back-end:8080/actuator/health/readiness;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Short, so a hung backend reads as down within the monitor's own timeout instead of
            # holding the probe open until the monitor gives up with a vaguer error.
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
        }
    }

    # ── HTTPS (TLS) — uncomment and configure for production ───────────────────
    # server {
