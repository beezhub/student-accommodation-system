networks:
  app-network:
    driver: bridge
  monitoring-network:
    driver: bridge

services:
  db:
    image: postgres:16.2-alpine
    container_name: student-accommodation-local-db
    environment:
      POSTGRES_PASSWORD: ${PASSWORD_DB}
      POSTGRES_USER: ${USER_DB}
      POSTGRES_DB: studentaccommodationlocaldb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB:-localadmin}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 512M

  student-accommodation-back-end:
    container_name: student-accommodation-back-end
    image: student-accommodation-back-end:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Selects application-<profile>.yml and the logback appender. Use "prod" in NONPROD and PROD:
      # it disables Swagger, makes the API docs PLATFORM_ADMIN-only and switches logging to JSON.
      # Empty here so local compose keeps the readable console appender.
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-}
      - POSTGRES_DB=studentaccommodationlocaldb
      - USER_DB=${USER_DB}
      - PASSWORD_DB=${PASSWORD_DB}
      - DB_URL=jdbc:postgresql://db:5432/studentaccommodationlocaldb
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-36000000}
      - JWT_ADMIN_EXPIRATION=${JWT_ADMIN_EXPIRATION:-14400000}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-student-accommodation-bucket}
      # Set only where storage is Amazon S3 rather than this MinIO container (GH-331).
      - MINIO_REGION=${MINIO_REGION:-}
      - MINIO_CREDENTIALS=${MINIO_CREDENTIALS:-static}
      - MINIO_CREATE_BUCKET=${MINIO_CREATE_BUCKET:-true}
      - MAIL_HOST=mailhog
      - MAIL_PORT=1025
      - MAIL_USERNAME=${MAIL_USERNAME:-noreply@studentaccommodation.local}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-test}
      - MAIL_SMTP_AUTH=${MAIL_SMTP_AUTH:-false}
      - MAIL_STARTTLS_ENABLE=${MAIL_STARTTLS_ENABLE:-false}
      - MAIL_CONNECT_TIMEOUT_MS=${MAIL_CONNECT_TIMEOUT_MS:-5000}
      - MAIL_READ_TIMEOUT_MS=${MAIL_READ_TIMEOUT_MS:-5000}
      - MAIL_WRITE_TIMEOUT_MS=${MAIL_WRITE_TIMEOUT_MS:-5000}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:4200}
      # Browser origins allowed to call the API, and the storage origin the CSP allows.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:4200}
      - STORAGE_PUBLIC_ORIGIN=${STORAGE_PUBLIC_ORIGIN:-http://localhost:9000}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - APP_SUPPORT_EMAIL=${APP_SUPPORT_EMAIL:-accommodation@university.edu}
      - APP_UNIVERSITY_NAME=${APP_UNIVERSITY_NAME:-University}
      # Read by application.yml, so it has to be forwarded: compose passes a container only the
      # variables listed here, not the whole .env. Blank keeps address lookup off.
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - GOOGLE_PLACES_REGION_CODE=${GOOGLE_PLACES_REGION_CODE:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Addresses whose X-Forwarded-For may be trusted. Without this every client behind a proxy
      # shares one rate-limit bucket, throttling the whole deployment.
      - APP_SECURITY_TRUSTED_PROXIES=${APP_SECURITY_TRUSTED_PROXIES:-}
      - AUTH_RATE_LIMIT_PER_MINUTE=${AUTH_RATE_LIMIT_PER_MINUTE:-30}
      # Empty keeps /actuator/prometheus PLATFORM_ADMIN-only; set it to let Prometheus scrape.
      - PROMETHEUS_SCRAPE_USER=${PROMETHEUS_SCRAPE_USER:-prometheus}
      - PROMETHEUS_SCRAPE_PASSWORD=${PROMETHEUS_SCRAPE_PASSWORD:-}
      # Timestamps are stored without a time zone and written from the JVM default, so the zone
      # is pinned. Changing it reinterprets every value already stored.
      - TZ=${APP_TIMEZONE:-UTC}
    restart: unless-stopped
    # Longer than spring.lifecycle.timeout-per-shutdown-phase, so graceful shutdown finishes
    # before Docker sends SIGKILL.
    stop_grace_period: 45s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 1G

  # The old minio/minio image ran as root, so a minio_data volume it wrote is owned by root. The
  # Chainguard image runs as nonroot (65532) and cannot write there. This one-shot hands the volume
  # to that user before MinIO starts; it is a no-op on a fresh volume and on every later boot.
  minio-volume-permissions:
    image: cgr.dev/chainguard/minio:latest@sha256:e70b2b1e74d79457f808710483bd726ff364529ca30736eaa15a6ab547d3a5a7
    user: "0:0"
    entrypoint: ["chown", "-R", "65532:65532", "/data"]
    volumes:
      - minio_data:/data
    restart: "no"
    networks:
      - app-network

  minio:
    # minio/minio no longer exists on Docker Hub (pulls return 404) and quay.io/minio requires an
    # account. Chainguard's free tier publishes only :latest, so the digest pins the exact build.
    image: cgr.dev/chainguard/minio:latest@sha256:e70b2b1e74d79457f808710483bd726ff364529ca30736eaa15a6ab547d3a5a7
    container_name: student-accommodation-minio
    depends_on:
      minio-volume-permissions:
        condition: service_completed_successfully
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      # The image carries neither curl nor wget. It carried curl until
      # RELEASE.2024-11-07, so the probe below worked until the image was bumped; afterwards every
      # attempt fails with "curl: executable file not found" and the container never reports
      # healthy, which blocks the backend's depends_on and stops a clean start dead. mc ships in
      # the image and is MinIO's own readiness command (GH-256).
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 512M

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: student-accommodation-mailhog
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI
    logging:
      driver: "none"  # Disable logs to reduce noise
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 128M

  redis:
    # Redis 8 is licensed AGPLv3 (OSI-approved). 7.x was RSALv2/SSPLv1 only, the one component in
    # the stack that was not open source.
    image: redis:8.2-alpine
    container_name: student-accommodation-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 256M

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: student-accommodation-prometheus
    volumes:
      - ./tools/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      # Without a volume every deploy recreated the container and threw away all metrics history,
      # which is exactly the before/after evidence a deploy is judged by (GH-249).
      - prometheus_data:/prometheus
    # The scrape password reaches Prometheus as a compose secret built from the same variable the
    # backend reads, so the two cannot disagree. It used to be a committed placeholder file that
    # the deploy had to avoid overwriting; a mismatch produced 401s on every scrape and empty
    # dashboards with no error anywhere. The key must exist in .env (an empty value is fine and
    # keeps /actuator/prometheus PLATFORM_ADMIN-only).
    secrets:
      - prometheus_scrape_password
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped
    networks:
      - app-network
      - monitoring-network
    deploy:
      resources:
        limits:
          memory: 256M

  grafana:
    image: grafana/grafana:10.3.3
    container_name: student-accommodation-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      # Where provisioned alerts are sent (tools/grafana/alerts/alerting.yaml). Falls back to the
      # support mailbox rather than a placeholder, so an alert always has somewhere real to go.
      # Delivery needs SMTP, which the production overlay configures from MAIL_*.
      - GRAFANA_ALERT_EMAIL=${GRAFANA_ALERT_EMAIL:-${APP_SUPPORT_EMAIL:-accommodation@university.edu}}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./tools/grafana/provisioning:/etc/grafana/provisioning
      - ./tools/grafana/dashboards:/var/lib/grafana/dashboards
      - ./tools/grafana/alerts:/etc/grafana/provisioning/alerting
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - monitoring-network
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  minio_data:
  postgres_data:
  redis_data:
  grafana_data:
  prometheus_data:

secrets:
  prometheus_scrape_password:
    environment: PROMETHEUS_SCRAPE_PASSWORD
