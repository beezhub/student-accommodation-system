version: "3"

services:
  db:
    image: postgres:16.2-alpine
    container_name: student-accommodation-local-db
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_USER: localadmin
      POSTGRES_DB: studentaccommodationlocaldb
    ports:
      - "5432:5432"

  student-accommodation-back-end:
    container_name: student-accommodation-back-end
    image: student-accommodation-back-end:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      no_cache: true
      args:
        - BUILDKIT_INLINE_CACHE=0
    ports:
      - "8080:8080"
    depends_on:
      - db
      - minio
      - mailhog
    environment:
      - POSTGRES_DB=studentaccommodationlocaldb
      - USER_DB=localadmin
      - PASSWORD_DB=admin
      - DB_URL=jdbc:postgresql://db:5432/studentaccommodationlocaldb
      - JWT_SECRET=jvc+QC/0myyJ9+//Rzo+qYxfMmHDiQdlysvcT9XhUF7/6mvHD9evZBB/ngNAMwTD6sDDQgf4vS0QDZ8JYLoBOA==
      - JWT_EXPIRATION=360000
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=student-accommodation-bucket
      - MAIL_HOST=mailhog
      - MAIL_PORT=1025
      - MAIL_USERNAME=student@gmail.com
      - MAIL_PASSWORD=test
      - APP_BASE_URL=http://localhost:3000
      - APP_SUPPORT_EMAIL=accommodation@university.edu
      - APP_UNIVERSITY_NAME=University

  minio:
    image: minio/minio
    container_name: student-accommodation-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: student-accommodation-mailhog
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI
    logging:
      driver: "none"  # Disable logs to reduce noise

volumes:
  minio_data:
  postgres_data: