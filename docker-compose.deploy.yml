# Deployment overlay. Adds what a server needs and neither the laptop file nor the production
# overlay provides: the frontend service, and a fixed address for it so the backend can name it as
# a trusted proxy.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.deploy.yml \
#     up -d
#
# TLS is not here. Caddy runs on the host (tools/caddy/Caddyfile): it needs ports 80 and 443 on the
# machine itself, and its certificate store has to survive a compose recreate. The frontend is
# published on loopback only, so the host proxy is the single way in.
#
# Partial against GH-246. Still outstanding from that issue:
#   - registry image digests for backend and frontend with `build: !reset null`, once GH-243 pushes
#     them. This file still builds from the tree: wrong for a server, right for a POC with no
#     registry.
#   - GH-246's managed-database section is obsolete. It was written for DigitalOcean Managed
#     PostgreSQL; the deployment now runs Postgres in a container on Oracle Cloud, so `db` stays.
#
# Logs: every container's stdout/stderr and the host's Caddy journal are shipped by Alloy to Loki
# and searched from Grafana's Explore page. Grafana is published on loopback only, and the host's
# Caddy serves it at https://<host>/grafana (README, Operations).

# Same rotation the production overlay applies to the base services; the anchor cannot be shared
# across files, so it is declared again here.
x-bounded-logs: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Published on loopback for the host's Caddy, which serves it at /grafana (tools/caddy/Caddyfile).
  # The prod overlay has already taken the base file's 0.0.0.0 publish away.
  grafana:
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # GRAFANA_ROOT_URL must be https://<host>/grafana. Without sub-path serving Grafana answers
      # every /grafana request with a redirect to /grafana/login, which is itself under /grafana, so
      # the login page loops forever and logs are unreachable.
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # Reachable from the internet now: the session cookie must never travel over plain HTTP, and
      # nobody may create their own account.
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.4.2
    container_name: student-accommodation-loki
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./tools/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    restart: unless-stopped
    networks:
      - monitoring-network
    logging: *bounded-logs
    deploy:
      resources:
        limits:
          memory: 512M

  alloy:
    image: grafana/alloy:v1.9.2
    container_name: student-accommodation-alloy
    # Root, not the image's alloy user: the Docker socket and the journal are root-readable on
    # the host, and the container's uid 473 matches nothing there.
    user: root
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./tools/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - monitoring-network
    logging: *bounded-logs
    deploy:
      resources:
        limits:
          memory: 256M

  frontend:
    container_name: student-accommodation-frontend
    image: student-accommodation-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # Loopback only. Nothing about this service should be reachable from outside the machine;
    # Caddy on the host is what the internet talks to.
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      student-accommodation-back-end:
        condition: service_started
    restart: unless-stopped
    logging: *bounded-logs
    networks:
      app-network:
        # Fixed address so APP_SECURITY_TRUSTED_PROXIES can name it. GH-252: the backend compares
        # trusted proxies by exact string rather than by CIDR, so a DHCP-assigned container address
        # would silently disable per-client rate limiting for every request through the proxy —
        # every caller would share one bucket.
        ipv4_address: 172.28.0.10
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  app-network:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  loki_data:
  alloy_data:
