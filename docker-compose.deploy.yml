# Deployment overlay. Adds what a server needs and neither the laptop file nor the production
# overlay provides: the frontend service, and a fixed address for it so the backend can name it as
# a trusted proxy.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.deploy.yml \
#     up -d
#
# TLS is not here. Caddy runs on the host (tools/caddy/Caddyfile): it needs ports 80 and 443 on the
# machine itself, and its certificate store has to survive a compose recreate. The frontend is
# published on loopback only, so the host proxy is the single way in.
#
# Images: backend and frontend are pulled from ECR by digest and never built on a server (#337).
# BACKEND_IMAGE and FRONTEND_IMAGE come from the deploy workflow, which built them on GitHub's ARM
# runners in the same run; they are not in the host .env.
#
# GH-246's managed-database section is obsolete. It was written for DigitalOcean Managed
# PostgreSQL; NONPROD runs Postgres in a container on Oracle Cloud, so `db` stays.
#
# Logs: every container's stdout/stderr and the host's Caddy journal are shipped by Alloy to Loki
# and searched from Grafana's Explore page. Grafana is published on loopback only, and the host's
# Caddy serves it at https://<host>/grafana (README, Operations).

# Same rotation the production overlay applies to the base services; the anchor cannot be shared
# across files, so it is declared again here.
x-bounded-logs: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Fixed addresses for db and minio so a developer's SSH tunnel has a target that survives a deploy
  # (#264). Neither has a host port; docs/NONPROD_RUNBOOK.md, "Developer access from your laptop",
  # has the commands.

  # Requires TLS like RDS, so a driver, URL or certificate problem shows on NONPROD first (#380).
  # Set with `command` and a mounted file, not an init script: init scripts only run on an empty
  # data directory, and NONPROD's already holds data. PROD switches off db and db-tls-cert.
  db:
    depends_on:
      db-tls-cert:
        condition: service_completed_successfully
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/tls/server.key
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - postgres_tls:/var/lib/postgresql/tls:ro
      - ./tools/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      app-network:
        ipv4_address: 172.28.0.20

  minio:
    networks:
      app-network:
        ipv4_address: 172.28.0.30

  # postgres:16.2-alpine has no openssl command, so this makes the self-signed certificate once and
  # exits. It reaches the network for openssl only when there is no certificate yet. uid 70 is the
  # image's postgres user, which refuses a key other users can read.
  db-tls-cert:
    image: alpine:3.22
    entrypoint:
      - sh
      - -ec
      - |
        cd /tls
        if [ ! -s server.key ] || [ ! -s server.crt ]; then
          apk add --no-cache --quiet openssl
          openssl req -new -x509 -days 3650 -nodes -newkey rsa:2048 -subj /CN=db \
            -keyout server.key -out server.crt
        fi
        chown 70:70 server.key server.crt
        chmod 600 server.key
    volumes:
      - postgres_tls:/tls
    restart: "no"
    logging: *bounded-logs
    networks:
      - app-network

  # Published on loopback for the host's Caddy, which serves it at /grafana (tools/caddy/Caddyfile).
  # The prod overlay has already taken the base file's 0.0.0.0 publish away.
  grafana:
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # GRAFANA_ROOT_URL must be https://<host>/grafana. Without sub-path serving Grafana answers
      # every /grafana request with a redirect to /grafana/login, which is itself under /grafana, so
      # the login page loops forever and logs are unreachable.
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # Reachable from the internet now: the session cookie must never travel over plain HTTP, and
      # nobody may create their own account.
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.4.2
    container_name: student-accommodation-loki
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./tools/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    restart: unless-stopped
    networks:
      - monitoring-network
    logging: *bounded-logs
    deploy:
      resources:
        limits:
          memory: 512M

  alloy:
    image: grafana/alloy:v1.9.2
    container_name: student-accommodation-alloy
    # Root, not the image's alloy user: the Docker socket and the journal are root-readable on
    # the host, and the container's uid 473 matches nothing there.
    user: root
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      # A directory, not a file: Alloy loads every .alloy file in it as one configuration. The
      # shared log pipeline plus this host's destination; docker-compose.aws.yml swaps the second
      # file for Grafana Cloud. conf.d rather than /etc/alloy itself, which holds the image's own
      # example config.alloy (debug logging, exporters pointed at localhost) that must not load.
      - /etc/alloy/conf.d
    volumes:
      - ./tools/alloy/logs.alloy:/etc/alloy/conf.d/logs.alloy:ro
      - ./tools/alloy/loki-local.alloy:/etc/alloy/conf.d/loki-local.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - monitoring-network
    logging: *bounded-logs
    deploy:
      resources:
        limits:
          memory: 256M

  # The base file builds the backend from the tree. On a server it is pulled by digest instead.
  student-accommodation-back-end:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be a registry reference by digest, repo@sha256:...}
    build: !reset null
    environment:
      - DB_URL=jdbc:postgresql://db:5432/studentaccommodationlocaldb?sslmode=require

  frontend:
    container_name: student-accommodation-frontend
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must be a registry reference by digest, repo@sha256:...}
    # Loopback only. Nothing about this service should be reachable from outside the machine;
    # Caddy on the host is what the internet talks to.
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      student-accommodation-back-end:
        condition: service_started
    restart: unless-stopped
    logging: *bounded-logs
    networks:
      app-network:
        # Fixed address so APP_SECURITY_TRUSTED_PROXIES can name it. GH-252: the backend compares
        # trusted proxies by exact string rather than by CIDR, so a DHCP-assigned container address
        # would silently disable per-client rate limiting for every request through the proxy —
        # every caller would share one bucket.
        ipv4_address: 172.28.0.10
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  app-network:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_tls:
  loki_data:
  alloy_data:
