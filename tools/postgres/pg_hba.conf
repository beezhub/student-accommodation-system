# Who may connect to the NONPROD Postgres container, and how (docker-compose.deploy.yml, #380).
# RDS rejects connections without TLS, so NONPROD does too. Postgres uses the first line that
# matches.

# The local socket inside the container, used only through `docker exec`: the healthcheck, the
# deploy's schema check, and pg_dump and pg_basebackup for backups (docs/BACKUP_AND_RESTORE.md).
local   all             all                                     trust
local   replication     all                                     trust

# Everything from the network must use TLS and a password. The certificate is self-signed, which is
# enough for sslmode=require: it encrypts but does not check the certificate, the same as PROD
# against RDS.
hostssl     all         all             all                     scram-sha-256
hostnossl   all         all             all                     reject
