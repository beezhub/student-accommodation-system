# Grafana contact point and notification policy.
#
# Lives next to the rule files rather than under tools/grafana/provisioning/, because compose
# mounts ./tools/grafana/alerts over /etc/grafana/provisioning/alerting, and that mount hid the
# copy that used to sit in provisioning/alerting/: Grafana never saw a contact point (GH-261).
# Refs: TASK-3.05, ARCH 6.4

apiVersion: 1

# Contact point for alert notifications. The address comes from the GRAFANA_ALERT_EMAIL
# environment variable, which compose defaults to the support mailbox; Grafana expands $VAR in
# provisioning files. Delivery needs GF_SMTP_* set, which docker-compose.prod.yml does from MAIL_*.
contactPoints:
  - orgId: 1
    name: Platform Admin Email
    receivers:
      - uid: platform-admin-email
        type: email
        settings:
          addresses: $GRAFANA_ALERT_EMAIL
          singleEmail: false

# Default notification policy — all alerts route to Platform Admin Email.
policies:
  - orgId: 1
    receiver: Platform Admin Email
    group_by:
      - alertname
      - severity
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
