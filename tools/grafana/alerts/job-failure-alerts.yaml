# Grafana Alerting Rule: Scheduled Job Failure
# Triggers when any scheduled job records a failure (sas.jobs.*.failures counter increments).
# Refs: TASK-3.05, ARCH 6.4, ARCH RISK-008

apiVersion: 1

groups:
  - orgId: 1
    name: scheduled-job-failures
    folder: SAS Alerts
    interval: 1m
    rules:
      - uid: sas-job-failure-alert
        title: Scheduled Job Failure
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: increase(sas_jobs_allocation_batch_failures_total[5m]) > 0 or increase(sas_jobs_offer_reminder_failures_total[5m]) > 0 or increase(sas_jobs_notification_retry_failures_total[5m]) > 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 0s
        annotations:
          summary: A scheduled job has recorded at least one failure in the last 5 minutes.
          description: Check logs for the failing job. Prometheus metric sas_jobs_*_failures_total has incremented.
        labels:
          severity: critical
          team: platform
