# Grafana alert rule provisioning configuration.
# Grafana reads YAML files from /etc/grafana/provisioning/alerting/ on startup.
# The alert rule files are mounted from tools/grafana/alerts/ into the container
# via the docker-compose volume: ./tools/grafana/alerts:/etc/grafana/provisioning/alerting
# Refs: TASK-3.05, ARCH 6.4

apiVersion: 1

# Contact point for alert notifications.
# Update smtp settings to match your environment or replace with a webhook receiver.
contactPoints:
  - orgId: 1
    name: Platform Admin Email
    receivers:
      - uid: platform-admin-email
        type: email
        settings:
          addresses: admin@example.com
          singleEmail: false

# Default notification policy — all alerts route to Platform Admin Email.
policies:
  - orgId: 1
    receiver: Platform Admin Email
    group_by:
      - alertname
      - severity
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
