# Loki, single binary, local filesystem. Receives every container's stdout/stderr and the host's
# Caddy journal from Alloy (tools/alloy/logs.alloy) and is queried from Grafana's Explore page.
#
# Not published on any port: Alloy pushes to it and Grafana reads from it over monitoring-network.
# Retention is two weeks. The compactor deletes older chunks in the background; there is no
# separate cleanup job and nothing to rotate.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 336h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # The backend's request id, tenant id and logger travel as structured metadata rather than
  # labels, so an unbounded value cannot explode the index.
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
