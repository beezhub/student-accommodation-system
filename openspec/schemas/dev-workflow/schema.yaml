name: dev-workflow

artifacts:
  # Agent 1: Senior Business Analyst
  - id: business-analysis
    generates: business-analysis.md
    requires: []
    description: "Senior Business Analyst - Requirements and user stories"

  # Agent 2: Solution Architect
  - id: solution-design
    generates: solution-design.md
    requires: [business-analysis]
    description: "Solution Architect - Technical design and architecture"

  # Agent 3: Senior Full Stack Developer
  - id: implementation-plan
    generates: implementation-plan.md
    requires: [solution-design]
    description: "Senior Full Stack Developer - Implementation tasks and code structure"

  # Agent 4: Tech Lead/Reviewer
  - id: tech-review
    generates: tech-review.md
    requires: [implementation-plan]
    description: "Tech Lead - Review readiness and risk assessment"

  # Note: "apply" phase is built-in, requires all artifacts above to exist