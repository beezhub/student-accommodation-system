# openspec/config.yaml
schema: dev-workflow

context: |
  ## Student Accommodation System
  
  A university accommodation management system with Spring Boot backend and Angular frontend.
  Manages student housing applications, room allocations, documents, and notifications.
  
  ### Tech Stack
  - **Backend**: Spring Boot 3.5.7, Java 17, Gradle 8.11.1
  - **Frontend**: Angular 21 with Material Design
  - **Database**: PostgreSQL 16.2 with Flyway migrations (V{YYYY_MM_DD_HHMM}__description.sql)
  - **Storage**: MinIO for file uploads
  - **Authentication**: JWT tokens with Spring Security
  - **API Docs**: SpringDoc OpenAPI (Swagger UI at /swagger-ui.html)
  - **Feature Flags**: FF4j
  
  ### Backend Package Structure (com.beezhub.student_accommodation)
  - controller/ → REST endpoints by domain
  - service/ → Business logic layer
  - repository/ → Spring Data JPA (extends JpaRepository, JpaSpecificationExecutor)
  - model/entity/ → JPA entities
  - model/dto/ → Request/Response DTOs (never expose entities in API)
  - model/enums/ → Enumerations (ApplicationStatus, RoomType, etc.)
  - mapper/ → MapStruct for entity-DTO conversion
  - security/ → JWT auth, user details, filters
  - config/ → Configuration classes
  - exceptions/ → Custom exceptions
  - specification/ → JPA Specifications for dynamic filtering
  - validation/ → Custom validators
  
  ### Frontend Module Structure (frontend/src/app)
  - features/auth/ → Login, signup, password reset, email verification
  - features/admin/ → Admin dashboard and management (buildings, rooms, applications, allocations)
  - features/student/ → Student-specific features
  - features/dashboard/ → Student dashboard (applications, documents, profile)
  - core/ → Services, guards, interceptors, models
  - shared/ → Reusable components
  
  ### Key Patterns & Conventions
  - **Database**: Enums stored as strings, no soft deletes, Flyway manages all schema changes
  - **Security**: JWT stateless, role-based (@PreAuthorize), admin tokens 4h, student tokens 10h
  - **Async**: Email sending via @Async, batch allocation on scheduled intervals
  - **Validation**: Jakarta Bean Validation on DTOs, Angular reactive forms mirror backend rules
  - **Testing**: JUnit + Jacoco for backend, Jasmine/Karma for frontend, target >80% coverage
  - **MapStruct**: Auto-generates entity-DTO mappers (rebuild after entity/DTO changes)
  
  ### Development Commands
  - Backend: `cd backend && ./gradlew bootRun` (port 8080)
  - Frontend: `cd frontend && npm start` (port 4200)
  - Docker: `docker-compose up --build` (full stack)
  - Tests: `./gradlew test` (backend), `npm test` (frontend)
  - Lint: `npm run lint` (frontend), `npm run lint:fix` (auto-fix)
  
  ### Domain Entities
  - app_user, student → Users and profiles
  - application → Housing applications with preferences
  - room_allocation, staged_allocation → Room assignments (staged = pending review)
  - building, room, building_image → Physical infrastructure
  - document → Uploaded files (MinIO storage)
  - notification, user_notification → Email tracking
  - allocation_rule → Scoring algorithm rules
  - waiting_list_entry → Waitlist management
  - academic_year, institution, year_of_study → Reference data
  - activity_log → Audit trail
  - system_setting → Config key-value pairs
  
  ### Integration Points
  - **MinIO**: Document storage with signed URLs
  - **Email**: SMTP with retry logic, async processing
  - **Google Maps API**: Geocoding for building addresses

rules:
  business-analysis:
    # PRIMARY FOCUS: Clarity — every requirement must be unambiguous, complete, and immediately actionable
    
    # Core Responsibilities
    - Extract requirements from code, configuration, schema, and documentation
    - Refine through clarifying questions until precise and unambiguous
    - Map every end-to-end workflow with entry/exit conditions, decision points, exception paths
    - Define testable acceptance criteria (if you cannot define a test, requirement is not clear)
    - Identify edge cases for every business rule (null inputs, max values, concurrent ops, expired tokens)
    - Map all integrations with contracts, data flows, error handling, failure modes
    - Produce specifications detailed enough to implement without reading source code
    
    # Accountabilities (Hard Gates)
    - No ambiguous requirements enter development (use "shall"/"shall not", measurable criteria)
    - All requirements meet Definition of Ready (unique ID, description, acceptance criteria, priority, source traceability, edge cases, dependencies)
    - Ask user to confirm any business rule where intent could be interpreted differently
    - Document happy path AND failure paths for every state transition and validation rule
    
    # Student Accommodation Specific
    - Focus on user value for students, admins, or university staff
    - Use Given/When/Then format for acceptance criteria
    - Identify all stakeholders (students, admins, support staff, university management)
    - Analyze 5-10 edge cases minimum (concurrent access, network failures, token expiry, full rooms, 3rd decline)
    - Consider full accommodation lifecycle (registration → application → document verification → allocation → offer → check-in → occupancy → check-out)
    - Reference existing features in CLAUDE.md and Requirements.md
    - Flag ambiguities with [INFERRED], conflicts with [CONFLICT], missing functionality with [GAP]
    
    # Quality Checks
    - Every requirement must have unique ID, clear description, acceptance criteria, priority, edge cases
    - Testable acceptance criteria translate directly into test cases
    - Well-defined boundaries prevent scope creep
    - Complete edge cases prevent "what should happen when...?" questions
  
  solution-design:
    # PRIMARY FOCUS: Stability — prioritize maintainability, scalability, security, and resilience
    
    # Core Responsibilities
    - Define system architecture with component boundaries, communication patterns, data flow
    - Establish and enforce coding standards, design patterns, API contracts, versioning rules
    - Design integration patterns with protocols, error handling, retry policies, failure modes
    - Evaluate against performance, scalability, security, reliability, maintainability requirements
    - Validate technology choices and flag risks
    - Produce living documentation with rationale and alternatives considered
    
    # Accountabilities (Hard Gates)
    - Long-term system health: evaluate against 2-year horizon (10x users, 5x data, 3x integrations)
    - Avoid technical debt accumulation (classify as intentional/accidental, prescribe repayment)
    - Support growth without rewrites (components independently deployable, testable, replaceable)
    - Security posture meets industry standards (auth, authz, data protection, communication security)
    
    # Spring Boot Architecture
    - Follow strict layering: Controller → Service → Repository → Entity
    - Use MapStruct for entity-DTO conversion (never expose entities in API)
    - Apply @PreAuthorize for role-based access (ADMIN vs STUDENT)
    - Design RESTful APIs: plural resources, proper HTTP methods, standard status codes
    - Plan Flyway migrations: V{YYYY_MM_DD_HHMM}__description.sql naming
    - Use JPA Specifications for dynamic filtering
    - Apply Jakarta Bean Validation on all DTOs
    - Hard limits: Service class <400 lines, Controller <200 lines, Method <30 lines
    - Constructor injection only (no @Autowired field injection)
    - @Transactional on individual methods, not class level
    
    # Angular Architecture
    - Follow structure: components in features/, services in core/, guards for routes
    - Use Angular Material Design components consistently
    - Standalone components with ChangeDetectionStrategy.OnPush
    - inject() function for DI (not constructor injection)
    - Component TS files <300 lines
    
    # Design Patterns & Anti-Patterns
    - Use Strangler Pattern for refactoring (wrap, extract, delegate — never rewrite)
    - Repository pattern for all data access (no EntityManager in services)
    - Service Layer for all business logic (no logic in controllers or entities)
    - Specification pattern for dynamic filtering
    - State Machine for status transitions (canTransitionTo() before every status change)
    - Facade when decomposing services (retain original as thin facade)
    - NO God classes, NO tight coupling, NO EAGER loading (use LAZY + fetch joins)
    
    # Performance & Scalability
    - Detect N+1 queries (use @EntityGraph or JOIN FETCH)
    - Plan indexes for performance-critical queries
    - Async operations for emails (@Async) and batch processing
    - Connection pooling (HikariCP configuration)
    - Pagination for large datasets
    
    # Security & Integration
    - JWT stateless auth, role hierarchy enforcement
    - No credentials in code, no stack traces in API responses
    - Input sanitization (XSS, SQL injection prevention)
    - Error handling with domain-specific exceptions mapped to HTTP codes
    - Integration failure isolation with retry logic and timeouts
    
    # Consider Backwards Compatibility
    - API contracts don't change without explicit authorization
    - Existing frontend calls must continue to work
    - Document breaking changes explicitly
    - Feature flags (FF4j) for risky changes
  
  implementation-plan:
    # PRIMARY FOCUS: Incremental Delivery — surgical, safe, backward-compatible changes
    
    # Core Principles
    - Apply Strangler Pattern: wrap, extend, extract, or delegate — NEVER rewrite from scratch
    - System must function at every commit (zero regressions)
    - One extraction at a time with full test verification
    - Preserve entry points (controllers, scheduled jobs, event listeners)
    
    # Task Structure
    - Keep tasks under 2 hours each
    - No task should touch more than 3 files
    - Group related changes together (e.g., entity + DTO + mapper in one task)
    - Order tasks by dependency (migrations → entities → services → controllers)
    - Include testing tasks for each layer (repository → service → controller)
    - Add tasks for API documentation (@Operation, @ApiResponses)
    - Plan frontend and backend tasks together for features
    - Separate tasks for error handling and validation
    
    # Strangler Pattern Steps
    - Step 1: Create new service in target package
    - Step 2: Copy (don't cut) methods from original
    - Step 3: Inject new service into original
    - Step 4: Update original to delegate
    - Step 5: Run ALL tests (must pass)
    - Step 6: Move annotations to new service
    - Step 7: Run tests again
    - Step 8: Update direct callers if specified
    - Step 9: Final test run
    - Step 10: Remove duplicated code from original (now thin facade)
    
    # Database Migration Tasks
    - One migration per logical change
    - Use IF NOT EXISTS / IF EXISTS guards for idempotence
    - Never modify executed migrations (create new one)
    - NOT NULL columns: add nullable → backfill → add constraint (3 steps)
    - Test on clean database AND existing database with data
    
    # Validation Before "Done"
    - All acceptance criteria checked
    - All specified tests written and passing
    - All existing tests still pass (./gradlew test, npm test)
    - Backend builds cleanly (./gradlew clean build)
    - Frontend builds cleanly (npm run build)
    - Frontend linting passes (npm run lint)
    - No FetchType.EAGER introduced
    - No service >400 lines, no method >30 lines
    - Conventional Commits format followed
    
    # Anti-Patterns to Avoid
    - NO rewriting working classes
    - NO changing API contracts without task authorization
    - NO fixing unrelated bugs in same branch (log separately)
    - NO skipping tests ("it's a small change")
    - NO modifying existing migrations (breaks checksum)
    - NO field injection (use constructor injection)
    - NO class-level @Transactional (method-level only)
    - NO Thread.sleep() in production code
    
    # Branch Strategy
    - Create from develop: feature/TASK-{id}-{short-description}
    - Never commit directly to main or develop
    - Conventional Commit messages: "type(scope): description"
    - Reference task ID and architecture sections in commit body
  
  tech-review:
    # PRIMARY FOCUS: Protection — prevent regression, drift, vulnerabilities, performance degradation, technical debt
    
    # Core Responsibilities
    - Review every pull request against coding standards, architectural alignment, test coverage, performance, security
    - Enforce coding standards as rules (not guidelines): Service >400 lines = BLOCK, Method >30 lines = REQUEST CHANGES
    - Validate test coverage: specified tests present, meaningful (not padding), existing tests pass
    - Check performance impact: N+1 queries, missing indexes, EAGER loading, unbounded queries, blocking ops
    - Validate security: no credentials in code, no stack traces in responses, auth checks present, input sanitized
    - Ensure architectural alignment: Strangler Pattern followed, facade retained, no new God classes
    - Block low-quality code: sloppy, untested, poorly named, overly complex, architecturally misaligned
    
    # Review Verdicts
    - APPROVE: All standards met, tests present and meaningful, no concerns, acceptance criteria satisfied
    - REQUEST CHANGES: Minor issues (naming, missing edge tests, incomplete docs, method slightly over limit)
    - BLOCK: Serious issues (security vulnerability, missing critical tests, regression, pattern violation, design problem)
    
    # Backend Review Checklist
    - Spring Boot package structure followed (controller/, service/, repository/, model/)
    - No business logic in controllers (mapping + validation + response only)
    - No business logic in entities (JPA annotations + fields + lifecycle callbacks only)
    - MapStruct used for entity-DTO mapping (entities never exposed in API)
    - JPA Specifications for dynamic filtering (no JPQL concatenation)
    - Constructor injection used (no @Autowired field injection)
    - @Transactional on individual methods with readOnly=true for reads
    - FetchType.LAZY on all associations (no EAGER), use @EntityGraph when needed
    - Domain-specific exceptions thrown (no generic RuntimeException)
    - Exceptions mapped to HTTP codes in RestResponseExceptionHandler
    - No stack traces in API responses, no sensitive data in logs
    - SLF4J logging with correct levels and context
    - Service classes <400 lines, Controller <200 lines, Methods <30 lines
    - Test naming: methodName_scenario_expectedResult()
    - Coverage: ≥70% per service, ≥90% for critical services
    
    # Frontend Review Checklist
    - Standalone components with ChangeDetectionStrategy.OnPush
    - inject() function for DI (not constructor injection)
    - Component TS files <300 lines
    - Observables unsubscribed (takeUntilDestroyed() or ngOnDestroy)
    - HTTP calls through typed services in core/services/
    - Angular Material components used consistently
    
    # Database Review Checklist
    - Flyway migration naming: V{YYYY_MM_DD_HHMM}__description.sql
    - IF NOT EXISTS / IF EXISTS guards present
    - No modifications to existing executed migrations
    - Index naming: idx_{table}_{column}
    - NOT NULL added via nullable → backfill → constraint steps
    
    # Security Review
    - @PreAuthorize correctly applied (ADMIN vs STUDENT roles)
    - JWT authentication on all protected endpoints
    - Input validation with Jakarta Bean Validation
    - No SQL injection risk (parameterized queries via JPA)
    - No XSS risk (output encoding)
    - No credentials in tracked files
    - State machine validation enforced (canTransitionTo() before status changes)
    
    # Performance Review
    - N+1 query detection (use JOIN FETCH or @EntityGraph)
    - Indexes added for performance-critical queries
    - No unbounded queries (pagination required for lists)
    - Async operations for emails and batch processing
    - Transaction scope appropriate (not too broad)
    
    # Architectural Review
    - Changes align with target architecture
    - Strangler Pattern followed for decomposition (facade retained)
    - No new tight coupling introduced
    - Service boundaries respected
    - Domain events used for side effects where specified
    - No shortcuts: tests required, hardcoded values avoided, proper exception types
    
    # Test Review
    - All specified tests present and passing
    - Edge cases from requirements covered
    - State machine transitions tested (valid paths return true, invalid return false)
    - Null/empty input cases handled
    - Mocks used appropriately (not over-mocking)
    - No @Disabled/@Ignore without linked issue
    
    # Regression Prevention
    - Existing tests still pass
    - Backward compatibility preserved (API contracts unchanged unless authorized)
    - No new EAGER loading
    - No new God classes or methods
    - Error handling patterns consistent