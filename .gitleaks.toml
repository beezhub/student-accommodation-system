# gitleaks configuration
# https://github.com/gitleaks/gitleaks

title = "Student Accommodation System - Gitleaks Config"

[extend]
# Extend the default gitleaks ruleset
useDefault = true

[[rules]]
id = "jwt-secret-default"
description = "Detects the specific JWT secret that was previously hardcoded in this repo"
regex = '''jvc\+QC/0myyJ9'''
tags = ["jwt", "secret", "hardcoded"]

[[rules]]
id = "minio-default-creds"
description = "Detects default MinIO credentials"
regex = '''minioadmin'''
tags = ["minio", "credentials", "default"]

[allowlist]
description = "Allowlisted paths that should not be scanned"
paths = [
    # The credential rotation doc intentionally references exposed values for tracking
    "CREDENTIAL_ROTATION.md",
    # .env.example contains placeholder values only, not real credentials
    ".env.example",
]
