name: CI

on:
  # Not main: a release merges files the develop push already tested, and a hotfix is tested on its
  # pull request. Deploy NONPROD checks that one of those runs passed before it builds (#385).
  # tools/ci/ci-passed.sh reads the push trigger's paths-ignore below, so keep the list here.
  push:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'test-cases/**'
      - 'ux-research/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'test-cases/**'
      - 'ux-research/**'

# One in-flight run per ref (or per pull request), so pushing a fixup commit cancels the run it
# supersedes instead of letting both finish (GH-284).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# While a release pull request (develop into main) is open, every push to develop also fires this
# workflow's pull_request trigger on the same commit the push trigger just built. The concurrency
# group above does not catch that, since a push and a pull_request event get different group keys.
# Every job below carries `if: github.event_name != 'pull_request' || github.head_ref != 'develop'`
# to skip that one case; the push-triggered run on develop already tested the commit (GH-284).

jobs:
  # No secrets scan. gitleaks-action requires a GITLEAKS_LICENSE for organisation-owned
  # repositories, which was never set, so the job failed on every run since it was added. A check
  # that is always red carries no information and teaches everyone to ignore a failing build,
  # which is worse than not having it (GH-163).
  #
  # If secret scanning comes back, run the pinned binary in a plain step with config in
  # .gitleaks.toml rather than the action, so it needs no licence key server at CI time.

  # ── Backend ───────────────────────────────────────────────────────────────
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.head_ref != 'develop'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Must match JavaLanguageVersion in backend/build.gradle and the Temurin tags in
      # backend/Dockerfile. ToolchainVersionConsistencyTest asserts all three agree (GH-215).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build (skip tests)
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-only-dummy-jwt-secret-not-for-production-0123456789abcdefghijklmnopqrstuvwxyz' }}
        run: ./gradlew build -x test

      - name: Run tests
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-only-dummy-jwt-secret-not-for-production-0123456789abcdefghijklmnopqrstuvwxyz' }}
        run: ./gradlew test

      - name: Generate Jacoco coverage report
        run: ./gradlew jacocoTestReport
        if: always()

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/build/reports/tests/

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/build/jacocoHtml/

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.head_ref != 'develop'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      # Explicit, so the step name and what it runs cannot drift apart again. The default
      # configuration is production today, but this step was named "Build (production)" while
      # relying on that default rather than stating it (GH-163).
      - name: Build (production)
        run: npm run build -- --configuration=production
