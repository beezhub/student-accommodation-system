name: Forager

# Forager audits one lens of the codebase per run and files up to three verified issues for a
# person to review. It never changes code. It is off until you set the repository variable
# FORAGER_ENABLED to "true" and add the ANTHROPIC_API_KEY secret. See .claude/forager/setup.md.

on:
  schedule:
    # Once a day, 05:00 UTC. The lens rotates with the weekday, so a daily run covers the whole
    # system every week; running it more often would refile nothing. Left off (FORAGER_ENABLED
    # unset) for the same reason as Scout: Actions minutes are metered and near the monthly
    # allowance (GH-284). A Claude Code Routine does the same job without spending minutes.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      lens:
        description: "Lens to audit: tenancy, backend, frontend, tests, docs-config, database, housekeeping. Leave empty for today's."
        required: false
        type: string

concurrency:
  # One Forager at a time, so two runs never file the same finding twice.
  group: forager
  cancel-in-progress: false

# Read code, write issues, nothing else. The agent is told never to push or touch pull requests;
# this token makes sure of it whatever it is prompted with.
permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  run:
    # Scheduled runs need the switch on. A manual run from the Actions tab always works.
    if: github.event_name == 'workflow_dispatch' || vars.FORAGER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check for the API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY is not set. Add it in Settings > Secrets and variables > Actions."
            echo "See .claude/forager/setup.md."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Must match JavaLanguageVersion in backend/build.gradle and ci.yml, so that a lens which
      # runs a targeted test sees the same toolchain CI does.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run Forager
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            /forager:run ${{ inputs.lens }}
