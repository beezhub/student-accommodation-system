name: Forager

# Forager flies one route card per run: a change a person has already specified, applied at
# every site the card names, in one pull request. It is off until you set the repository
# variable FORAGER_ENABLED to "true" and add the ANTHROPIC_API_KEY secret.
# See .claude/forager/setup.md.

on:
  schedule:
    # Once a day, and at :30 rather than on the hour so a scheduled run can never start
    # alongside Scout. Daily rather than hourly because the queue is written by hand: an
    # hourly Forager would spend almost every run waking up to find no route card and
    # reporting so, which is Actions minutes spent on nothing (GH-287). Running it from
    # the Actions tab after writing a card is the intended way to use it.
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: "Route card issue number to fly. Leave empty to take the oldest in the queue."
        required: false
        type: string

concurrency:
  # Never let two Forager runs overlap. They would collide on the same route.
  group: forager
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  run:
    # Scheduled runs need the switch on. A manual run from the Actions tab always works.
    if: github.event_name == 'workflow_dispatch' || vars.FORAGER_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Longer than Scout's 45: a route is many small edits plus a full check across all of
    # them, and the run is worthless if it is cut off halfway through a sweep.
    timeout-minutes: 60
    steps:
      - name: Check for the API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY is not set. Add it in Settings > Secrets and variables > Actions."
            echo "See .claude/forager/setup.md."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21 to match the toolchain in backend/build.gradle and ci.yml. Note scout.yml
          # still says 17, which will not build this project.
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run Forager
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            /forager:run ${{ inputs.issue }}
