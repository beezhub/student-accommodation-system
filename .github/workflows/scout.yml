name: Scout

# Scout picks up one open issue per run, fixes it on a branch, and opens a pull request.
# It is off until you set the repository variable SCOUT_ENABLED to "true" and add the
# ANTHROPIC_API_KEY secret. See .claude/scout/setup.md.

on:
  schedule:
    # Every hour, on the hour (UTC).
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to work on. Leave empty to let Scout choose."
        required: false
        type: string

concurrency:
  # Never let two Scout runs overlap. They would collide on the same issue.
  group: scout
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  run:
    # Scheduled runs need the switch on. A manual run from the Actions tab always works.
    if: github.event_name == 'workflow_dispatch' || vars.SCOUT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check for the API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY is not set. Add it in Settings > Secrets and variables > Actions."
            echo "See .claude/scout/setup.md."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run Scout
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            /scout:run ${{ inputs.issue }}
