# Production overlay. Use with the base file, which stays tuned for local development:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# GH-162: the base file publishes every backing service on the host, ships MailHog as the mail
# server, runs Redis with no password, and leaves TLS to something outside compose. That is right
# for a laptop and wrong for anything reachable. This overlay closes each of those rather than
# hardening the base file, so local development keeps working unchanged.
#
# Set these before using it: JWT_SECRET, PASSWORD_DB, MINIO_ACCESS_KEY, MINIO_SECRET_KEY,
# GRAFANA_ADMIN_PASSWORD, REDIS_PASSWORD, MAIL_HOST, MAIL_USERNAME, MAIL_PASSWORD, ALLOWED_ORIGINS,
# APP_BASE_URL, STORAGE_PUBLIC_ORIGIN. See CREDENTIAL_ROTATION.md before rotating any of them.

services:
  db:
    # No host port. The backend reaches it over the compose network; nothing else needs to.
    ports: !override []
    environment:
      POSTGRES_PASSWORD: ${PASSWORD_DB:?PASSWORD_DB must be set}

  student-accommodation-back-end:
    environment:
      # Selects application-prod.yml: Swagger off, API docs restricted, JSON logging.
      - SPRING_PROFILES_ACTIVE=prod
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      # A real SMTP server. MailHog accepts and silently discards everything, so leaving the base
      # file's value here means no student ever receives an email.
      - MAIL_HOST=${MAIL_HOST:?MAIL_HOST must be set}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_SMTP_AUTH=true
      - MAIL_STARTTLS_ENABLE=true
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      # Without this every client behind the proxy shares one rate-limit bucket.
      - APP_SECURITY_TRUSTED_PROXIES=${APP_SECURITY_TRUSTED_PROXIES:?set to the proxy addresses}
      # Read by application.yml but forwarded by neither compose file, so a fresh database gets no
      # PLATFORM_ADMIN and no supported way to create one — the deployment reports success and
      # nobody can log in (GH-257). Clear both once the first login has changed the password.
      - ADMIN_BOOTSTRAP_EMAIL=${ADMIN_BOOTSTRAP_EMAIL:-}
      - ADMIN_BOOTSTRAP_PASSWORD=${ADMIN_BOOTSTRAP_PASSWORD:-}
    # Reachable only through the reverse proxy that terminates TLS.
    ports: !override []

  minio:
    # The API stays internal. Publish the console deliberately, or reach it over a tunnel.
    ports: !override []
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}

  # MailHog is a development mail catcher. It accepts every message and delivers none, so it must
  # not run anywhere real. Scaled to zero rather than removed, because compose cannot delete a
  # service an overlay inherits.
  mailhog:
    deploy:
      replicas: 0
    profiles: ["never"]

  redis:
    ports: !override []
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]

  prometheus:
    ports: !override []

  grafana:
    ports: !override []
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      # Grafana is behind the proxy; tell it so, or its generated links point at the container.
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
