# NONPROD overlay: what makes the Oracle server run like PROD (#378). Used only by deploy.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.deploy.yml \
#     -f docker-compose.nonprod.yml up -d --no-build
#
# Today this is monitoring only (#381): Alloy ships to the same Grafana Cloud stack as PROD with the
# label env=nonprod, and Grafana, Prometheus and Loki stop running here. The alloy block repeats the
# one in docker-compose.aws.yml because that overlay also switches off the database and MinIO, which
# NONPROD still needs. When #382 adds the AWS overlay underneath this file, this block shrinks to
# the ALLOY_ENV line.

services:
  alloy:
    volumes: !override
      - ./tools/alloy/logs.alloy:/etc/alloy/conf.d/logs.alloy:ro
      - ./tools/alloy/grafana-cloud.alloy:/etc/alloy/conf.d/grafana-cloud.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy_data:/var/lib/alloy/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    # Loki is not running here.
    depends_on: !reset []
    environment:
      # PROD's alert rules only read env="prod", so a NONPROD outage pages nobody.
      - ALLOY_ENV=nonprod
      - GRAFANA_CLOUD_LOGS_URL=${GRAFANA_CLOUD_LOGS_URL:?GRAFANA_CLOUD_LOGS_URL must be set}
      - GRAFANA_CLOUD_LOGS_USER=${GRAFANA_CLOUD_LOGS_USER:?GRAFANA_CLOUD_LOGS_USER must be set}
      - GRAFANA_CLOUD_METRICS_URL=${GRAFANA_CLOUD_METRICS_URL:?GRAFANA_CLOUD_METRICS_URL must be set}
      - GRAFANA_CLOUD_METRICS_USER=${GRAFANA_CLOUD_METRICS_USER:?GRAFANA_CLOUD_METRICS_USER must be set}
      - GRAFANA_CLOUD_API_KEY=${GRAFANA_CLOUD_API_KEY:?GRAFANA_CLOUD_API_KEY must be set}
    # Alloy now does Prometheus's job, so it needs the backend's network and the scrape password.
    secrets:
      - prometheus_scrape_password
    networks:
      - monitoring-network
      - app-network
    deploy:
      resources:
        limits:
          memory: 384M

  # Replicas alone, with no profile. These containers are already running on NONPROD, and Compose
  # leaves a running container alone when a profile switches its service off. It only removes one
  # when the replicas drop to zero. PROD never had them, so its overlay can use either.
  grafana:
    deploy:
      replicas: 0

  prometheus:
    deploy:
      replicas: 0

  loki:
    deploy:
      replicas: 0
